<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="koalaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CB3A8" />
      <stop offset="100%" stop-color="#7B9488" />
    </linearGradient>
    <linearGradient id="koalaEarInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3DF" />
      <stop offset="100%" stop-color="#E2CAC4" />
    </linearGradient>
    <linearGradient id="koalaCheek" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C5B8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F7C5B8" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Outer Ears with fluffy tufts -->
  <circle cx="38" cy="46" r="30" fill="url(#koalaBody)" />
  <circle cx="122" cy="46" r="30" fill="url(#koalaBody)" />
  <circle cx="38" cy="46" r="18" fill="url(#koalaEarInner)" />
  <circle cx="122" cy="46" r="18" fill="url(#koalaEarInner)" />
  <path d="M 18 52 Q 26 44 22 36 Q 30 38 32 30" stroke="#7B9488" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 142 52 Q 134 44 138 36 Q 130 38 128 30" stroke="#7B9488" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Head -->
  <ellipse cx="80" cy="85" rx="52" ry="46" fill="url(#koalaBody)" />

  <!-- Cheeks -->
  <ellipse cx="48" cy="94" rx="10" ry="7" fill="url(#koalaCheek)" />
  <ellipse cx="112" cy="94" rx="10" ry="7" fill="url(#koalaCheek)" />

  <!-- Eyes (Warm, happy closed arch eyes) -->
  <path d="M 52 78 Q 61 70 70 78" stroke="#2B3A33" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 90 78 Q 99 70 108 78" stroke="#2B3A33" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Big iconic soft Koala nose -->
  <ellipse cx="80" cy="88" rx="15" ry="21" fill="#2E3C36" />
  <ellipse cx="76" cy="81" rx="4" ry="7" fill="#4B5E55" opacity="0.6" />

  <!-- Friendly gentle smile -->
  <path d="M 74 114 Q 80 120 86 114" stroke="#2B3A33" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Subtle little leaf on forehead/ear -->
  <path d="M 106 32 C 114 26 124 30 122 40 C 114 42 108 38 106 32 Z" fill="#6DA582" />
  <path d="M 108 34 Q 116 33 120 37" stroke="#4C795E" stroke-width="1.5" stroke-linecap="round" fill="none" />
</svg>
