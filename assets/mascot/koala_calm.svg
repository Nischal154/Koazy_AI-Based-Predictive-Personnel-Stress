<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="calmBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93ACA1" />
      <stop offset="100%" stop-color="#6F887C" />
    </linearGradient>
    <linearGradient id="calmInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFDD" />
      <stop offset="100%" stop-color="#E2CAC4" />
    </linearGradient>
  </defs>
  <!-- Outer Ears -->
  <circle cx="38" cy="46" r="30" fill="url(#calmBody)" />
  <circle cx="122" cy="46" r="30" fill="url(#calmBody)" />
  <circle cx="38" cy="46" r="18" fill="url(#calmInner)" />
  <circle cx="122" cy="46" r="18" fill="url(#calmInner)" />

  <!-- Head -->
  <ellipse cx="80" cy="85" rx="52" ry="46" fill="url(#calmBody)" />

  <!-- Peaceful soft breathing eyes -->
  <path d="M 52 80 C 58 84 66 84 72 80" stroke="#2B3A33" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 88 80 C 94 84 102 84 108 80" stroke="#2B3A33" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <ellipse cx="80" cy="88" rx="15" ry="21" fill="#26342E" />
  <ellipse cx="76" cy="81" rx="4" ry="7" fill="#4B5E55" opacity="0.6" />

  <!-- Soft smile -->
  <path d="M 75 115 Q 80 118 85 115" stroke="#2B3A33" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Small resting paws at bottom -->
  <ellipse cx="62" cy="132" rx="14" ry="10" fill="url(#calmBody)" />
  <ellipse cx="98" cy="132" rx="14" ry="10" fill="url(#calmBody)" />
</svg>
