  <path d="M18 29 L16 33" stroke="#42A5F5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M26 29 L24 33" stroke="#42A5F5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M34 29 L32 33" stroke="#42A5F5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ears (slightly drooped) -->
  <circle cx="21" cy="40" r="16" fill="#84909E"/>
  <circle cx="21" cy="40" r="10" fill="#E8C3C9"/>
  <circle cx="79" cy="40" r="16" fill="#84909E"/>
  <circle cx="79" cy="40" r="10" fill="#E8C3C9"/>

  <!-- Body -->
  <ellipse cx="50" cy="87" rx="26" ry="17" fill="#84909E"/>

  <!-- Head -->
  <ellipse cx="50" cy="50" rx="34" ry="27" fill="#929FA9"/>

  <!-- Cheeks -->
  <circle cx="31" cy="56" r="5" fill="#FFA5A5" opacity="0.4"/>
  <circle cx="69" cy="56" r="5" fill="#FFA5A5" opacity="0.4"/>

