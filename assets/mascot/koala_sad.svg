  <path d="M34 42 Q39 45 44 42" stroke="#242B33" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M56 42 Q61 45 66 42" stroke="#242B33" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sad Eyes -->
  <ellipse cx="38" cy="48" rx="2.8" ry="3.5" fill="#242B33"/>
  <ellipse cx="62" cy="48" rx="2.8" ry="3.5" fill="#242B33"/>

  <!-- Teardrop on right cheek -->
  <path d="M68 53 C68 53 65 57 65 59 C65 60.5 66.5 62 68 62 C69.5 62 71 60.5 71 59 C71 57 68 53 68 53 Z" fill="#42A5F5"/>

  <!-- Big Nose -->
