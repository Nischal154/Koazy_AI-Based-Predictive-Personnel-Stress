<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Circle clip -->
  <clipPath id="avatarClip">
    <circle cx="40" cy="40" r="40"/>
  </clipPath>
  <g clip-path="url(#avatarClip)">
    <!-- Background -->
    <rect width="80" height="80" fill="#FCECE6"/>
    <!-- Shoulders / Clothes -->
    <path d="M12 80 C12 60 25 54 40 54 C55 54 68 60 68 80 Z" fill="#2E4057"/>
    <path d="M33 54 L40 64 L47 54 Z" fill="#E8D5C8"/>
    <!-- Neck -->
    <rect x="35" y="44" width="10" height="13" fill="#E8B49B"/>
    <!-- Head -->
    <ellipse cx="40" cy="34" rx="16" ry="19" fill="#F7C5AB"/>
    <!-- Hair back -->
    <path d="M22 36 C20 18 30 10 40 10 C50 10 60 18 58 36 C58 50 56 56 54 60 C50 54 48 40 48 40 C48 40 32 40 32 40 C32 54 30 54 26 60 C24 56 22 50 22 36 Z" fill="#3D2314"/>
    <!-- Face features -->
    <!-- Eyes -->
    <ellipse cx="34" cy="34" rx="2" ry="2.5" fill="#29180E"/>
    <ellipse cx="46" cy="34" rx="2" ry="2.5" fill="#29180E"/>
    <!-- Eyebrows -->
    <path d="M31 30 Q34 28 37 30" stroke="#3D2314" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M43 30 Q46 28 49 30" stroke="#3D2314" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Smile -->
    <path d="M37 42 Q40 45 43 42" stroke="#B04A3C" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <circle cx="31" cy="38" r="3" fill="#FF8A80" opacity="0.4"/>
    <circle cx="49" cy="38" r="3" fill="#FF8A80" opacity="0.4"/>
    <!-- Hair bangs / front -->
    <path d="M24 28 C26 18 34 14 42 14 C50 14 56 18 56 26 C52 20 46 19 40 21 C34 23 28 24 24 28 Z" fill="#4E2F1B"/>
  </g>
</svg>
