<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Group rotated slightly for head tilt -->
  <g transform="rotate(-6 50 50)">
    <!-- Ears -->
    <circle cx="20" cy="36" r="17" fill="#8E99A5"/>
    <circle cx="20" cy="36" r="10.5" fill="#F0CED4"/>
    <circle cx="80" cy="36" r="17" fill="#8E99A5"/>
    <circle cx="80" cy="36" r="10.5" fill="#F0CED4"/>

    <!-- Body -->
    <ellipse cx="50" cy="86" rx="26" ry="18" fill="#8E99A5"/>

    <!-- Head -->
    <ellipse cx="50" cy="48" rx="34" ry="28" fill="#9DA9B7"/>

    <!-- Cheeks -->
    <circle cx="30" cy="54" r="5" fill="#FFA5A5" opacity="0.5"/>
    <circle cx="70" cy="54" r="5" fill="#FFA5A5" opacity="0.5"/>

    <!-- Eyebrows (One high, one low) -->
    <path d="M33 39 Q38 36 43 40" stroke="#242B33" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M57 41 Q62 44 67 41" stroke="#242B33" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Curious Eyes (Different sizes) -->
    <ellipse cx="38" cy="46" rx="3" ry="4" fill="#242B33"/>
    <circle cx="37" cy="44" r="1.2" fill="#FFFFFF"/>
    <ellipse cx="62" cy="46" rx="4" ry="4" fill="#242B33"/>
    <circle cx="61" cy="44" r="1.5" fill="#FFFFFF"/>

    <!-- Big Nose -->
    <ellipse cx="50" cy="53" rx="8" ry="11" fill="#242B33"/>
    <ellipse cx="48" cy="50" rx="2.5" ry="3.5" fill="#4B5664" opacity="0.6"/>

    <!-- Puzzled small oval mouth -->
    <ellipse cx="50" cy="65" rx="3.5" ry="2.5" fill="#242B33"/>
  </g>

  <!-- Question mark -->
  <text x="82" y="28" font-family="'Google Sans Flex', 'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#7E57C2">?</text>
</svg>
