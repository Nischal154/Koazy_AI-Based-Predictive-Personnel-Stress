  <circle cx="114" cy="204" r="2.5" fill="#6B7785"/>
  <circle cx="120" cy="202" r="2.5" fill="#6B7785"/>
  <circle cx="126" cy="204" r="2.5" fill="#6B7785"/>
  <circle cx="194" cy="204" r="2.5" fill="#6B7785"/>
  <circle cx="200" cy="202" r="2.5" fill="#6B7785"/>
  <circle cx="206" cy="204" r="2.5" fill="#6B7785"/>

  <!-- Koala Head -->
  <!-- Left Ear -->
  <circle cx="106" cy="98" r="28" fill="#84909E"/>
  <circle cx="106" cy="98" r="17" fill="#F0CED4"/>
  <!-- Right Ear -->
  <circle cx="214" cy="98" r="28" fill="#84909E"/>
  <circle cx="214" cy="98" r="17" fill="#F0CED4"/>

  <!-- Head Base -->
