  <!-- Signboard "You Got This ♥" -->
  <g transform="rotate(-2 160 170)">
    <!-- Board drop shadow -->
    <rect x="114" y="146" width="94" height="60" rx="9" fill="#3B2616" opacity="0.12"/>
    <!-- Board body -->
    <rect x="112" y="144" width="96" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <!-- Inner board outline -->
    <rect x="116" y="148" width="88" height="50" rx="5" fill="#FDFDFD" stroke="#E8E8E8" stroke-width="1"/>
    
    <!-- Text: You Got This -->
    <text x="160" y="165" font-family="'Google Sans Flex', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#242B33" text-anchor="middle">You</text>
    <text x="160" y="179" font-family="'Google Sans Flex', 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#242B33" text-anchor="middle">Get This</text>
    <!-- Little Red Heart -->
    <path d="M160 193 C160 193 154 188 154 185.5 C154 183.8 155.5 182.5 157.2 182.5 C158.5 182.5 159.5 183.3 160 184 C160.5 183.3 161.5 182.5 162.8 182.5 C164.5 182.5 166 183.8 166 185.5 C166 188 160 193 160 193 Z" fill="#FF5252"/>
  </g>

  <!-- Paws holding the board -->
  <ellipse cx="115" cy="172" rx="9" ry="8" fill="#84909E"/>
  <ellipse cx="205" cy="170" rx="9" ry="8" fill="#84909E"/>
