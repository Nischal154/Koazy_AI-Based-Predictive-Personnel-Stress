  <path d="M260 215 Q265 200 272 205 Q268 212 265 218" stroke="#688C43" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="275" cy="202" r="3" fill="#FF8370"/>
  <circle cx="48" cy="198" r="3" fill="#FFDA63"/>

  <!-- Koala Body -->
