  <path d="M136 114 Q142 108 148 114" stroke="#242B33" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M172 114 Q178 108 184 114" stroke="#242B33" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Big Nose -->
