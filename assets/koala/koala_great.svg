<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Ears -->
  <circle cx="20" cy="35" r="17" fill="#8E99A5"/>
  <circle cx="20" cy="35" r="10.5" fill="#F0CED4"/>
  <circle cx="80" cy="35" r="17" fill="#8E99A5"/>
  <circle cx="80" cy="35" r="10.5" fill="#F0CED4"/>

  <!-- Body & Arms Raised / Cheerful -->
  <ellipse cx="50" cy="86" rx="28" ry="20" fill="#8E99A5"/>
  <ellipse cx="24" cy="74" rx="8" ry="12" transform="rotate(-30 24 74)" fill="#8E99A5"/>
  <ellipse cx="76" cy="74" rx="8" ry="12" transform="rotate(30 76 74)" fill="#8E99A5"/>

  <!-- Head -->
  <ellipse cx="50" cy="48" rx="34" ry="28" fill="#9DA9B7"/>

  <!-- Cheeks -->
  <circle cx="30" cy="54" r="6" fill="#FFA5A5" opacity="0.7"/>
  <circle cx="70" cy="54" r="6" fill="#FFA5A5" opacity="0.7"/>

  <!-- Joyful Curved Eyes -->
  <path d="M35 45 Q40 40 45 45" stroke="#242B33" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M55 45 Q60 40 65 45" stroke="#242B33" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Big Nose -->
  <ellipse cx="50" cy="52" rx="8" ry="11" fill="#242B33"/>
  <ellipse cx="48" cy="49" rx="2.5" ry="3.5" fill="#4B5664" opacity="0.6"/>

  <!-- Big Happy Open Smile -->
  <path d="M43 61 Q50 69 57 61 Z" fill="#D32F2F"/>
  <path d="M45 61 Q50 64 55 61" stroke="#242B33" stroke-width="1.5" fill="none"/>

  <!-- Little Sparkle -->
  <path d="M12 18 L14 12 L16 18 L22 20 L16 22 L14 28 L12 22 L6 20 Z" fill="#FFD15C"/>
